# Proposed protocol. Codex must resolve repository entries and freeze the plan at C0.
experiment_id: tfim_tud_rebuttal_v1
protocol_status: draft_pending_repository_discovery

model:
  family: periodic_tfim_first_order
  coupling_J: 1.0
  transverse_h: 1.0
  gamma: 0.1
  delta: 0.1
  delta_provenance: proposed_default_not_yet_verified_against_repository
  jump_convention: sqrt_gamma_times_X_minus_iY_over_2
  primary_sizes: [3, 4, 6, 8]
  extension_sizes: [10, 12]
  channel_primary_sizes: [4]
  channel_attempt_sizes: [8]

comparison:
  primary_unit: complete_single_kraus_block_encoding
  fixed_kraus_family: true
  kraus_search_enabled: false
  canonicalization: exact_merge_and_exact_zero_removal
  matched_beta_source: actual_pauli_backend_scale
  mandatory_methods: [pauli_placement, tud_factored_diagonal, tud_separate]
  optional_methods: [tud_factored_ucrz, single_kraus_isometry, pauli_placement_disabled]
  normalization_modes: [matched, native]
  primary_report: matched
  # In native mode Pauli uses its original scale, TUD uses the SVD spectral norm.
  # Never reduce the Pauli scale merely by changing metadata.

synthesis:
  qiskit_version: null  # Resolve and lock; never silently upgrade the project env.
  unitary_entry: qiskit.synthesis.qs_decomposition
  qsd_deprecated_flags: do_not_pass_opt_a1_or_opt_a2
  diagonal_entry: qiskit.circuit.library.DiagonalGate
  optional_ucrz_entry: qiskit.circuit.library.UCRZGate
  basis_gates: [u, cx]
  approximation_degree: 1.0
  optimization_levels: [0, 3]
  qubits_initially_zero: false
  coupling_map: null
  backend: null
  target: null
  seed_transpiler: 646
  num_processes: 1

numerics:
  dtype: complex128
  rank_truncation: forbidden
  input_perturbation: forbidden
  clip_tolerance: 1.0e-12
  algebra_relative_fro_tolerance: 1.0e-10
  normalized_unitarity_fro_tolerance: 1.0e-10
  compiled_block_operator_tolerance: 1.0e-8
  small_full_operator_max_system_qubits: 4
  large_probe_random_states: 8
  probe_seed: 646
  validation_wall_budget_seconds: 900
  validation_statevector_memory_budget_gib: 2.0

resources:
  workers: 1
  blas_threads: 1
  primary_end_to_end_wall_budget_seconds: 1800
  extension_end_to_end_wall_budget_seconds: 3600
  worker_rss_budget_gib: 8.0
  memory_poll_interval_seconds: 0.2
  repetitions_up_to_n6: 3
  repetitions_n8_and_above: 1
  # Validation and serialization are separate from compilation wall time.
  # Validation budget exhaustion must not be labeled synthesis timeout.

workflow:
  checkpoints: [C0, C1, C2, C3, C4, C5]
  recommended_human_review_after: [C2]
  extensions_require_explicit_enable: true
  full_pauli_experiment_in_scope: false
  repository_path: null
  channelir_adapter_module: null
